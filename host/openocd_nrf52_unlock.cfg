adapter driver st-link
st-link vid_pid 0x0483 0x374e
transport select dapdirect_swd
adapter speed 100
reset_config none
swd newdap chip cpu -expected-id 0x2ba01477
dap create chip.dap -chain-position chip.cpu
init
chip.dap dpreg 0x04 0x50000000
sleep 100
echo "CTRL/STAT=[chip.dap dpreg 0x04]"
if {[catch {chip.dap apreg 1 0x04 0x01} e]} { echo "ERASEALL-write FAILED: $e" } else { echo "ERASEALL=1 OK" }
sleep 1500
catch {chip.dap apreg 1 0x04 0x00}
if {[catch {chip.dap apreg 1 0x00 0x01} e]} { echo "reset FAILED: $e" } else { echo "reset OK" }
sleep 200
catch {chip.dap apreg 1 0x00 0x00}
sleep 900
echo "erase-done"
shutdown
