<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Episode report</title>
<style>
  @page { size: A4 landscape; margin: 7mm; }
  :root { --ink:#111; --muted:#555; --line:#bbb; --grid1:#f3c4c4; --grid5:#e58f8f; --a:#e07b00; --b:#1f6fd1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ebee; color: var(--ink); font: 9pt/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .tools { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 8px 16px; background: #171b22; color: #e6edf3; font-size: 12px; }
  .tools button, .tools input { font: inherit; }
  .tools button { background: #2a303b; color: #e6edf3; border: 1px solid #3a4250; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .tools input { width: 70px; background: #1e232c; color: #e6edf3; border: 1px solid #3a4250; border-radius: 6px; padding: 3px 6px; }
  #msg { color: #ffb454; }
  .page { width: 283mm; min-height: 196mm; margin: 12px auto; padding: 4mm 5mm; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.25); overflow: hidden; }
  @media print { body { background: #fff; } .tools { display: none; } .page { margin: 0; box-shadow: none; padding: 0; width: 283mm; min-height: 0; max-height: 195mm; } }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 6mm; border-bottom: 0.3mm solid var(--ink); padding-bottom: 1.5mm; }
  h1 { font-size: 11pt; margin: 0 0 0.3mm; }
  .meta { color: var(--muted); font-size: 7.5pt; }
  .note { font-size: 7.5pt; text-align: right; max-width: 105mm; }
  .note b { color: #b00020; }
  .strip { margin-top: 1.2mm; }
  .strip .lab { font-size: 7.5pt; color: var(--muted); display: flex; justify-content: space-between; }
  .strip .lab b { color: var(--ink); }
  .row { display: grid; grid-template-columns: 92mm 50mm 64mm 1fr; gap: 3mm; margin-top: 1.5mm; }
  .box h2 { font-size: 8pt; margin: 0 0 0.6mm; }
  .box .sub { font-size: 6.5pt; color: var(--muted); margin-bottom: 0.5mm; }
  table { border-collapse: collapse; width: 100%; font-size: 6.4pt; font-variant-numeric: tabular-nums; }
  th, td { padding: 0.1mm 0.8mm; border-bottom: 0.15mm solid #ddd; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; }
  .hint { font-size: 6.3pt; margin-top: 0.8mm; padding: 0.8mm 1.2mm; border-left: 0.8mm solid var(--a); background: #faf6ef; }
  .hint.same { border-left-color: var(--b); background: #eef4fb; }
  .notes { font-size: 6.6pt; margin-top: 0.8mm; }
  svg text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
</style>
</head>
<body>
<div class="tools">
  <b>Episode report</b>
  <label title="ECG scale: ADC counts per millivolt at the strap's input. Unknown for this front end unless calibrated (e.g. with a 1 mV test signal); the strips are drawn at 10 mm per this many counts.">counts per mV <input id="cal" type="number" min="50" max="20000" step="10"></label>
  <button id="print">Print / save as PDF</button>
  <span id="msg">loading…</span>
</div>
<div class="page" id="page">
  <header>
    <div>
      <h1>RR alternans / bigeminy — episode report</h1>
      <div class="meta" id="h-meta"></div>
      <div class="meta" id="h-meta2"></div>
    </div>
    <div class="note"><b>Single-lead chest strap, front-end high-pass 1.7 Hz — not a diagnostic device.</b><br><span id="h-filter"></span></div>
  </header>
  <div class="strip"><div class="lab" id="s1-lab"></div><div id="s1"></div></div>
  <div class="strip"><div class="lab" id="s2-lab"></div><div id="s2"></div></div>
  <div class="strip"><div class="lab" id="s3-lab"></div><div id="s3"></div></div>
  <div class="row">
    <div class="box"><h2>RR tachogram</h2><div class="sub" id="tach-sub"></div><div id="tach"></div></div>
    <div class="box"><h2>Poincaré (RR<sub>n</sub> vs RR<sub>n+1</sub>)</h2><div class="sub" id="poin-sub"></div><div id="poin"></div></div>
    <div class="box"><h2>Split averaged beat (A vs B)</h2><div class="sub" id="split-sub"></div><div id="split"></div><div id="split-tab"></div></div>
    <div class="box"><h2>Summary</h2><div id="sum"></div><div class="notes" id="notes"></div></div>
  </div>
</div>
<script src="/static/hrv.js"></script>
<script src="/static/qrst.js"></script>
<script src="/static/dtw.js"></script>
<script src="/static/alternans.js"></script>
<script src="/static/report.js"></script>
</body>
</html>
