CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HRM Raw RR"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
# Sized to the largest notification (ECG = 2 + 30*2 = 62 B -> ATT PDU 65 -> MTU 65).
# Bigger ATT batches mean fewer notifications, which is what the macOS ~30 notify/s
# ceiling limits: the full 500 Hz stream now fits in 16.7 notifies/s. The negotiated
# ATT MTU caps notify size BOTH ways and is min(peer, our RX MTU = ACL_RX_SIZE - 4),
# so RX must also be >= 69 for a 65 B ATT PDU (not just TX). DLE stays 27 (the link
# layer sends the 65 B PDU as a few LL fragments within one connection event).
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27
CONFIG_BT_BUF_ACL_TX_COUNT=6
# iOS/macOS-friendly preferred connection parameters (Apple: min >= 15 ms)
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
# ECG sampling uses the SAADC via nrfx directly (hardware-timed EasyDMA), not the
# Zephyr ADC driver -- so the nrfx driver owns the SAADC IRQ. The internal sample
# timer replaces the external TIMER1/counter clock.
CONFIG_NRFX_SAADC=y
CONFIG_BT_BAS=y
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
# Stack sizes trimmed from measured high-water marks (CONFIG_INIT_STACKS probe),
# with >=65% headroom over the worst case seen under load. ISR stack left at
# default (shared by the radio ISR; overflow there is unrecoverable).
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
CONFIG_BT_RX_STACK_SIZE=768
CONFIG_POWEROFF=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=768
